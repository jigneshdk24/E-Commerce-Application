<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wishlist Debug</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="container mt-5">
    <h1>Wishlist Debug Page</h1>
    
    <div class="row">
      <div class="col-md-6">
        <h3>Test Controls</h3>
        <button class="btn btn-primary mb-2" onclick="addToWishlist(1)">Add Product 1</button>
        <button class="btn btn-primary mb-2" onclick="addToWishlist(2)">Add Product 2</button>
        <button class="btn btn-primary mb-2" onclick="addToWishlist(3)">Add Product 3</button>
        <button class="btn btn-danger mb-2" onclick="clearWishlist()">Clear All</button>
        <button class="btn btn-info mb-2" onclick="showDebug()">Show Debug Info</button>
      </div>
      
      <div class="col-md-6">
        <h3>Current Status</h3>
        <div id="status"></div>
      </div>
    </div>
    
    <div class="mt-4">
      <h3>Wishlist Items</h3>
      <div id="wishlist-display"></div>
    </div>
    
    <div class="mt-4">
      <h3>Console Log</h3>
      <div id="console-log" style="background: #f8f9fa; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto;"></div>
    </div>
  </div>

  <script src="assets/js/products.js"></script>
  <script>
    // Override console.log to show in our debug area
    const originalLog = console.log;
    const logContainer = document.getElementById('console-log');
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      const logEntry = document.createElement('div');
      logEntry.textContent = new Date().toLocaleTimeString() + ': ' + args.join(' ');
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    };
    
    function addToWishlist(productId) {
      console.log('Adding product', productId, 'to wishlist');
      const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
      if (!wishlist.includes(productId)) {
        wishlist.push(productId);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        console.log('Wishlist updated:', wishlist);
        updateDisplay();
      } else {
        console.log('Product already in wishlist');
      }
    }
    
    function clearWishlist() {
      console.log('Clearing wishlist');
      localStorage.removeItem("wishlist");
      updateDisplay();
    }
    
    function showDebug() {
      console.log('=== DEBUG INFO ===');
      console.log('PRODUCTS_DATA:', PRODUCTS_DATA);
      console.log('LocalStorage wishlist:', localStorage.getItem("wishlist"));
      console.log('LocalStorage cart:', localStorage.getItem("cart"));
      console.log('Window location:', window.location.href);
    }
    
    function updateDisplay() {
      const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
      const statusDiv = document.getElementById('status');
      const displayDiv = document.getElementById('wishlist-display');
      
      // Update status
      statusDiv.innerHTML = `
        <p><strong>Wishlist Count:</strong> ${wishlist.length}</p>
        <p><strong>Products Available:</strong> ${PRODUCTS_DATA.length}</p>
        <p><strong>LocalStorage Keys:</strong> ${Object.keys(localStorage).join(', ')}</p>
      `;
      
      // Update wishlist display
      if (wishlist.length === 0) {
        displayDiv.innerHTML = "<p class='text-muted'>Wishlist is empty</p>";
      } else {
        displayDiv.innerHTML = wishlist.map(id => {
          const product = PRODUCTS_DATA.find(p => p.id === id);
          if (product) {
            return `
              <div class="card mb-2">
                <div class="card-body">
                  <h6>${product.title}</h6>
                  <p class="mb-1">Price: $${product.price}</p>
                  <p class="mb-1">Rating: ${product.rating}/5</p>
                  <button class="btn btn-sm btn-danger" onclick="removeFromWishlist(${id})">Remove</button>
                </div>
              </div>
            `;
          } else {
            return `<div class="text-danger">Product ${id} not found!</div>`;
          }
        }).join("");
      }
    }
    
    function removeFromWishlist(productId) {
      console.log('Removing product', productId, 'from wishlist');
      const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
      const updatedWishlist = wishlist.filter(id => id !== productId);
      localStorage.setItem("wishlist", JSON.stringify(updatedWishlist));
      console.log('Wishlist updated:', updatedWishlist);
      updateDisplay();
    }
    
    // Initialize display
    console.log('Debug page loaded');
    updateDisplay();
    showDebug();
  </script>
</body>
</html>
