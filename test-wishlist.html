<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wishlist Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <div class="container mt-5">
    <h1>Wishlist Functionality Test</h1>
    
    <div class="row">
      <div class="col-md-6">
        <h3>Add to Wishlist Test</h3>
        <button class="btn btn-primary" onclick="testAddToWishlist(1)">Add Product 1 to Wishlist</button>
        <button class="btn btn-primary" onclick="testAddToWishlist(2)">Add Product 2 to Wishlist</button>
        <button class="btn btn-primary" onclick="testAddToWishlist(3)">Add Product 3 to Wishlist</button>
      </div>
      
      <div class="col-md-6">
        <h3>Current Wishlist</h3>
        <div id="current-wishlist"></div>
        <button class="btn btn-danger" onclick="clearWishlist()">Clear Wishlist</button>
      </div>
    </div>
    
    <div class="mt-4">
      <h3>LocalStorage Debug</h3>
      <pre id="localstorage-debug"></pre>
    </div>
  </div>

  <script src="assets/js/products.js"></script>
  <script>
    function testAddToWishlist(productId) {
      const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
      if (!wishlist.includes(productId)) {
        wishlist.push(productId);
        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        updateDisplay();
      }
    }
    
    function clearWishlist() {
      localStorage.removeItem("wishlist");
      updateDisplay();
    }
    
    function updateDisplay() {
      const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
      const container = document.getElementById("current-wishlist");
      const debug = document.getElementById("localstorage-debug");
      
      if (wishlist.length === 0) {
        container.innerHTML = "<p>Wishlist is empty</p>";
      } else {
        container.innerHTML = wishlist.map(id => {
          const product = PRODUCTS_DATA.find(p => p.id === id);
          return `<div class="mb-2">${product ? product.title : `Product ${id}`}</div>`;
        }).join("");
      }
      
      debug.textContent = JSON.stringify({
        wishlist: wishlist,
        products: PRODUCTS_DATA.length,
        localStorage: Object.keys(localStorage)
      }, null, 2);
    }
    
    // Initialize display
    updateDisplay();
  </script>
</body>
</html>
